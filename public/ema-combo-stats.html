<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EMA Combo Stats</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      .combo-shell { width: min(1540px, calc(100vw - 32px)); }
      .combo-controls {
        display: grid;
        grid-template-columns: repeat(6, minmax(140px, 1fr)) auto;
        gap: 10px;
        margin: 14px 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      .combo-controls label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
      }
      .combo-controls select,
      .combo-controls input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--text);
        padding: 9px 10px;
        outline: none;
      }
      .combo-controls button {
        align-self: end;
        border: 1px solid rgba(96,165,250,.45);
        border-radius: 6px;
        background: rgba(96,165,250,.14);
        color: #bfdbfe;
        padding: 9px 13px;
        font-weight: 900;
        cursor: pointer;
      }
      .combo-summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(160px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }
      .combo-stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
      }
      .combo-stat span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
      }
      .combo-stat strong {
        display: block;
        margin-top: 5px;
        font-size: 24px;
      }
      .combo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(390px, 1fr));
        gap: 10px;
      }
      .combo-card {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px 12px 12px 16px;
      }
      .combo-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--muted);
      }
      .combo-card.strong {
        border-color: #2dd4bf;
        background: linear-gradient(135deg, rgba(20,83,45,.70), rgba(8,47,73,.46), rgba(15,23,42,.94));
        box-shadow: 0 0 0 1px rgba(45,212,191,.25), 0 14px 30px rgba(20,184,166,.14);
      }
      .combo-card.good {
        border-color: #34d399;
        background: linear-gradient(135deg, rgba(6,78,59,.48), rgba(15,23,42,.94));
      }
      .combo-card.neutral {
        border-color: #fbbf24;
        background: linear-gradient(135deg, rgba(66,32,6,.34), rgba(15,23,42,.94));
      }
      .combo-card.bad {
        border-color: #fb7185;
        background: linear-gradient(135deg, rgba(127,29,29,.52), rgba(15,23,42,.94));
      }
      .combo-card.long::before { background: #22c55e; }
      .combo-card.short::before { background: #fb7185; }
      .combo-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }
      .combo-title {
        font-size: 14px;
        font-weight: 950;
      }
      .combo-actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
        flex: 0 0 auto;
      }
      .combo-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 8px;
      }
      .combo-chip {
        display: inline-flex;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(157,170,165,.28);
        color: #cde6dd;
        font-size: 10px;
        font-weight: 900;
      }
      .combo-chip.good { color: #34d399; border-color: rgba(52,211,153,.55); }
      .combo-chip.warn { color: #fbbf24; border-color: rgba(251,191,36,.58); }
      .combo-chip.bad { color: #fb7185; border-color: rgba(251,113,133,.58); }
      .combo-metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 10px;
      }
      .combo-metric {
        border: 1px solid rgba(157,170,165,.18);
        border-radius: 6px;
        background: rgba(0,0,0,.12);
        padding: 8px;
      }
      .combo-metric span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
      }
      .combo-metric strong {
        display: block;
        margin-top: 4px;
        font-size: 15px;
      }
      .pos { color: var(--green); }
      .neg { color: var(--red); }
      .muted { color: var(--muted); }
      @media (max-width: 900px) {
        .combo-controls { grid-template-columns: 1fr 1fr; }
        .combo-summary { grid-template-columns: 1fr 1fr; }
        .combo-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="combo-shell shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">EMA Squeeze Paper</p>
          <h1>Combo Stats</h1>
        </div>
        <div class="top-actions">
          <a class="nav-link" href="/ema-squeeze">EMA Squeeze</a>
          <a class="nav-link" href="/liquid-flow-v2">Liquid Flow V2</a>
          <a class="nav-link" href="/">Dashboard</a>
          <div class="status" id="comboStatus">Loading...</div>
        </div>
      </section>

      <section class="combo-controls">
        <label>Page
          <select id="pageFilter">
            <option value="ema" selected>EMA Squeeze</option>
            <option value="pump">Pump</option>
            <option value="edge">Edge Short</option>
            <option value="cap">Cap</option>
            <option value="liquid">Liquid Scan</option>
            <option value="ppks">Post Pump Kill</option>
          </select>
        </label>
        <label>Signal type
          <select id="typeFilter">
            <option value="all">All</option>
            <option value="Runner" selected>Runner</option>
            <option value="BR-like">BR-like</option>
            <option value="BR-like Short">BR-like Short</option>
            <option value="Breakout">Breakout</option>
            <option value="Pre Breakout">Pre Breakout</option>
            <option value="Squeeze">Squeeze</option>
            <option value="Squeeze Short">Squeeze Short</option>
            <option value="Pre Breakdown">Pre Breakdown</option>
          </select>
        </label>
        <label>Theo ngày
          <select id="dayFilter">
            <option value="all">Tất cả</option>
          </select>
        </label>
        <label>Khung nến
          <select id="tfFilter">
            <option value="all">Tất cả</option>
            <option value="5m">5m</option>
            <option value="15m">15m</option>
            <option value="1h">1h</option>
          </select>
        </label>
        <label>Combo
          <select id="comboFilter">
            <option value="all">All EMA + BR</option>
            <option value="ema">EMA only</option>
            <option value="br">BR-like only</option>
          </select>
        </label>
        <label>Sắp xếp
          <select id="sortFilter">
            <option value="quality">GOOD trước · mẫu ≥10 · AvgROE</option>
            <option value="default">Mẫu nhiều trước</option>
          </select>
        </label>
        <button id="reloadBtn" type="button">Reload</button>
      </section>

      <section class="combo-summary">
        <article class="combo-stat"><span>Combos</span><strong id="statCombos">-</strong></article>
        <article class="combo-stat"><span>Closed WR</span><strong id="statWr">-</strong></article>
        <article class="combo-stat"><span>Net PnL</span><strong id="statPnl">-</strong></article>
        <article class="combo-stat"><span>Avg ROE</span><strong id="statRoe">-</strong></article>
      </section>

      <section id="comboGrid" class="combo-grid"></section>
    </main>
    <script src="/ema-combo-stats.js"></script>
  </body>
</html>

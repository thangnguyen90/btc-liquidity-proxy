name: Deploy to EC2

on:
  push:
    branches:
      - main  # Tự động deploy khi push lên branch main

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: eventech-dev-btc-proxy  # Tên repo trên ECR
  IMAGE_TAG: ${{ github.sha }}            # Tag bằng commit hash để dễ rollback

# Bắt buộc để OIDC hoạt động
permissions:
  id-token: write  # Lấy OIDC token từ GitHub
  contents: read   # Đọc source code

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Kết nối AWS qua OIDC — không cần Access Key / Secret Key
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Đăng nhập ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build và push Docker image lên ECR
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 5. SSH vào EC2 và deploy image mới
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            # Đăng nhập ECR từ EC2 (dùng IAM role, không cần aws configure)
            aws ecr get-login-password --region ap-northeast-1 | \
              docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # Pull image mới
            docker pull ${{ steps.build-image.outputs.image }}

            # Dừng container cũ
            docker stop btc-proxy 2>/dev/null || true
            docker rm btc-proxy 2>/dev/null || true

            # Chạy container mới
            docker run -d \
              --name btc-proxy \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /home/ubuntu/btc-proxy/.env \
              ${{ steps.build-image.outputs.image }}

            # Xóa image cũ tiết kiệm disk
            docker image prune -f

            echo "✅ Deploy thành công: ${{ steps.build-image.outputs.image }}"
